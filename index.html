<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のリスト</title>
<meta name="description" content="今日のリスト — シンプルなToDo・タスク管理アプリ。追加、完了チェック、検索ができます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #eef0e6;
    --paper-line: #d9dccb;
    --ink: #1f2a1f;
    --ink-soft: #4a5a48;
    --pine: #1e3d2f;
    --pine-bright: #2f5c46;
    --gold: #a9822f;
    --danger: #a34a3d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(30,61,47,0.06), transparent 40%),
      var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 20px 80px;
  }
  .sheet{
    width:100%;
    max-width:560px;
    background:#f6f7f0;
    border:1px solid var(--paper-line);
    box-shadow: 0 1px 0 #fff inset, 0 24px 48px -24px rgba(30,42,30,0.35);
    position:relative;
    padding:44px 40px 36px;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:10px;
    background:
      repeating-linear-gradient(115deg,
        #f6f7f0 0 14px,
        var(--paper) 14px 16px);
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:26px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    margin:0;
    letter-spacing:0.01em;
  }
  #today{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
  }
  .add-row{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  #new-task{
    flex:1;
    border:none;
    border-bottom:1px solid var(--ink-soft);
    background:transparent;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    padding:10px 2px;
    color:var(--ink);
    outline:none;
  }
  #new-task::placeholder{color:#8b9488;}
  #new-task:focus{border-bottom:1px solid var(--pine);}
  #add-btn{
    border:1px solid var(--pine);
    background:var(--pine);
    color:#f6f7f0;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    padding:0 18px;
    cursor:pointer;
    transition:background .15s ease;
  }
  #add-btn:hover{background:var(--pine-bright);}

  .search-row{
    position:relative;
    margin-bottom:16px;
  }
  #search{
    width:100%;
    border:1px solid var(--paper-line);
    background:#fff;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    padding:9px 32px 9px 12px;
    color:var(--ink);
    outline:none;
  }
  #search:focus{border-color:var(--pine);}
  #search::placeholder{color:#a7ad9d;}
  #search-clear{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#a7ad9d;
    font-size:15px;
    cursor:pointer;
    display:none;
    line-height:1;
  }
  #search-clear.show{display:block;}
  #search-clear:hover{color:var(--danger);}

  .filters{
    display:flex;
    gap:16px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .filters button{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:inherit;
    padding:0;
    border-bottom:1px solid transparent;
  }
  .filters button.active{
    color:var(--ink);
    border-bottom:1px solid var(--gold);
  }

  ul#list{
    list-style:none;
    margin:0;
    padding:0;
  }
  li{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--paper-line);
    counter-increment: line;
  }
  li:first-child{border-top:1px solid var(--paper-line);}
  .num{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#a7ad9d;
    padding-top:4px;
    width:20px;
  }
  .check{
    width:19px;
    height:19px;
    border:1.5px solid var(--ink-soft);
    border-radius:3px;
    flex-shrink:0;
    margin-top:2px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
  }
  .check svg{
    width:12px;height:12px;
    opacity:0;
    transform:scale(0.6);
    transition:opacity .12s ease, transform .12s ease;
  }
  li.done .check{
    background:var(--pine);
    border-color:var(--pine);
  }
  li.done .check svg{opacity:1;transform:scale(1);}
  .label{
    flex:1;
    font-size:15px;
    line-height:1.5;
    padding-top:1px;
    word-break:break-word;
    cursor:pointer;
  }
  li.done .label{
    color:#9aa294;
    text-decoration:line-through;
    text-decoration-color:var(--gold);
  }
  .del{
    background:none;
    border:none;
    color:#b9beac;
    font-size:16px;
    cursor:pointer;
    padding:0 2px;
    line-height:1;
    font-family:'JetBrains Mono', monospace;
  }
  .del:hover{color:var(--danger);}

  .empty{
    text-align:center;
    padding:40px 0;
    color:#9aa294;
    font-size:14px;
  }

  footer{
    display:flex;
    justify-content:space-between;
    margin-top:22px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  footer button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:inherit;
    cursor:pointer;
  }
  footer button:hover{color:var(--danger);}
</style>
</head>
<body>
  <div class="sheet">
    <header>
      <h1>今日のリスト</h1>
      <div id="today"></div>
    </header>

    <div class="add-row">
      <input id="new-task" type="text" placeholder="やることを書く…" maxlength="120">
      <button id="add-btn">追加</button>
    </div>

    <div class="search-row">
      <input id="search" type="text" placeholder="検索…" maxlength="120">
      <button id="search-clear" title="クリア">×</button>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">すべて</button>
      <button data-filter="active">未完了</button>
      <button data-filter="done">完了</button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty-msg" style="display:none;">まだ何もありません。上に書いてみましょう。</div>

    <footer>
      <span id="count">0 件</span>
      <button id="clear-done">完了を削除</button>
    </footer>
  </div>

<script>
  const STORAGE_KEY = 'todo-sheet-tasks';
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';
  let query = '';

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty-msg');
  const countEl = document.getElementById('count');
  const input = document.getElementById('new-task');
  const searchInput = document.getElementById('search');
  const searchClear = document.getElementById('search-clear');

  document.getElementById('today').textContent = new Date().toLocaleDateString('ja-JP', {
    year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'
  });

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function addTask(text){
    text = text.trim();
    if(!text) return;
    tasks.unshift({ id: Date.now(), text, done:false });
    save();
    render();
  }

  function toggleTask(id){
    const t = tasks.find(t => t.id === id);
    if(t){ t.done = !t.done; save(); render(); }
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function clearDone(){
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function render(){
    const q = query.trim().toLowerCase();
    const filtered = tasks.filter(t => {
      if(filter === 'active' && t.done) return false;
      if(filter === 'done' && !t.done) return false;
      if(q && !t.text.toLowerCase().includes(q)) return false;
      return true;
    });

    listEl.innerHTML = '';
    filtered.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.innerHTML = `
        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <span class="check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f6f7f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span class="label">${escapeHtml(t.text)}</span>
        <button class="del" title="削除">×</button>
      `;
      li.querySelector('.check').addEventListener('click', () => toggleTask(t.id));
      li.querySelector('.label').addEventListener('click', () => toggleTask(t.id));
      li.querySelector('.del').addEventListener('click', () => deleteTask(t.id));
      listEl.appendChild(li);
    });

    emptyEl.style.display = filtered.length ? 'none' : 'block';
    emptyEl.textContent = q
      ? `「${q}」に一致するものはありません。`
      : 'まだ何もありません。上に書いてみましょう。';
    const remaining = tasks.filter(t => !t.done).length;
    countEl.textContent = `${remaining} 件 未完了 / 全 ${tasks.length} 件`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('add-btn').addEventListener('click', () => {
    addTask(input.value);
    input.value = '';
    input.focus();
  });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      addTask(input.value);
      input.value = '';
    }
  });

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('clear-done').addEventListener('click', clearDone);

  searchInput.addEventListener('input', () => {
    query = searchInput.value;
    searchClear.classList.toggle('show', query.length > 0);
    render();
  });
  searchClear.addEventListener('click', () => {
    query = '';
    searchInput.value = '';
    searchClear.classList.remove('show');
    searchInput.focus();
    render();
  });

  render();
</script>
</body>
</html>
